[pytest]
# 测试分层（P2-3）：
#   smoke  —— 快速门禁集：纯单元/离线闭环，不依赖外网与生产库，秒级跑完，提交前必过。
#   （默认）全量集：4,700+ 用例，约 16 分钟，CI / 发版前跑。
# 用法：
#   python3 -m pytest -m smoke -q          # 只跑快速门禁
#   python3 -m pytest tests/ -q             # 全量
markers =
    smoke: 快速门禁集（离线、纯单元、秒级），提交前必过
testpaths = tests
python_files = test_*.py
