<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reflex Quant · 交易健康度</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --txt:#e6e8ee; --dim:#8b93a7;
          --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
  header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:14px; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:600; }
  .dim { color:var(--dim); font-size:12px; }
  input { background:#0c0e12; color:var(--txt); border:1px solid var(--line);
          border-radius:8px; padding:6px 10px; width:260px; }
  button { background:#222835; color:var(--txt); border:1px solid var(--line);
           border-radius:8px; padding:6px 14px; cursor:pointer; }
  main { padding:18px 22px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .k { color:var(--dim); font-size:12px; margin-bottom:6px; }
  .v { font-size:22px; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; }
  .p-ok { background:rgba(46,204,113,.14); color:var(--ok); }
  .p-warn { background:rgba(241,196,15,.14); color:var(--warn); }
  .p-bad { background:rgba(231,76,60,.16); color:var(--bad); }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:500; }
  .pos { color:var(--ok); } .neg { color:var(--bad); }
  .err { color:var(--bad); white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>交易健康度</h1>
  <span class="dim">只读 · 每 10 秒刷新</span>
  <input id="base" value="http://127.0.0.1:8100" title="API 地址" />
  <button onclick="load()">刷新</button>
  <span id="stamp" class="dim"></span>
</header>
<main>
  <div id="err" class="err"></div>
  <div class="grid" id="cards"></div>
  <div class="card" style="margin-top:12px">
    <div class="k">当前持仓</div>
    <table>
      <thead><tr><th>#</th><th>品种</th><th>方向</th><th>数量</th><th>入场</th><th>现价</th><th>止损</th><th>浮盈亏</th></tr></thead>
      <tbody id="pos"></tbody>
    </table>
  </div>
</main>
<script>
function n(v, d=2) { return v==null ? "—" : Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
function card(k, v, cls="") { return `<div class="card"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`; }
async function load() {
  const base = document.getElementById("base").value.replace(/\/$/, "");
  const err = document.getElementById("err");
  try {
    const r = await fetch(base + "/api/trading/health");
    const h = await r.json();
    if (h.error || h.ok === false && !h.blocks) { err.textContent = h.error || "接口返回异常"; }
    else { err.textContent = ""; }
    const mood = h.blocks && h.blocks.length ? "p-bad" : (h.warnings && h.warnings.length ? "p-warn" : "p-ok");
    const moodTxt = h.blocks && h.blocks.length ? "有 block" : (h.warnings && h.warnings.length ? "仅提示" : "正常");
    document.getElementById("cards").innerHTML = [
      card("权益 (USDT)", n(h.equity), (h.realized_pnl||0) < 0 ? "neg" : ""),
      card("现金", n(h.cash)),
      card("已实现盈亏", (h.realized_pnl>0?"+":"") + n(h.realized_pnl), h.realized_pnl < 0 ? "neg" : "pos"),
      card("浮盈亏", (h.unrealized>0?"+":"") + n(h.unrealized), h.unrealized < 0 ? "neg" : "pos"),
      card("杠杆", n(h.leverage_pct,1) + "%"),
      card("持仓", (h.n_open ?? 0) + " 笔"),
      card("行情延迟", h.last_tick_age_s==null ? "—" : h.last_tick_age_s + "s",
           (h.last_tick_age_s||0) > 300 ? "neg" : ""),
      card("对账 / 告警", `<span class="pill ${mood}">${moodTxt}</span> · ${h.alerts_open ?? 0} 告警`),
    ].join("");
    document.getElementById("pos").innerHTML = (h.positions||[]).map(p => `
      <tr><td>${p.id}</td><td>${p.asset}</td><td>${p.side}</td><td>${n(p.qty,4)}</td>
      <td>${n(p.entry_price,2)}</td><td>${n(p.mark,2)}</td>
      <td>${p.stop_price==null ? "无" : n(p.stop_price,2)}${p.trailing_bp ? ` / 跟踪${p.trailing_bp}bp`:""}</td>
      <td class="${(p.upnl||0) < 0 ? "neg" : "pos"}">${(p.upnl>0?"+":"") + n(p.upnl)}</td></tr>`).join("")
      || `<tr><td colspan="8" class="dim">无持仓</td></tr>`;
    if (h.blocks && h.blocks.length) err.textContent = "对账 block: " + h.blocks.join(", ");
    document.getElementById("stamp").textContent = "更新于 " + new Date().toLocaleTimeString();
  } catch (e) {
    err.textContent = "请求失败：" + e + "\n检查 API 是否在 " + base + " 运行";
  }
}
load(); setInterval(load, 10000);
</script>
</body>
</html>
