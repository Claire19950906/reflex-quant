name: ci

# 目的不是"跑一遍全量"，而是让每次提交都能回答一个问题：
# "这次改动有没有让原本绿的东西变红"。
#
# 设计取舍：
#   * 全量 3,500+ 条测试在本机约需数分钟到十几分钟；CI 上先跑"离线核心子集"
#     （结构/口径/端点契约），全量挂在 nightly / workflow_dispatch。
#   * 所有测试必须离线：conftest.py 已把 DB / 熔断器 / 限流槽隔离到临时目录，
#     CI 里再显式设 TRIDENT_OFFLINE=1，防止任何用例意外打到真实网络。
#   * 端点基线（architecture_baseline.py）作为**护栏**产出 artifact：
#     拆分 api_server 期间，端点数只应"有计划地"变化，不该悄悄掉。
#   * lint 只拦「错误级」规则（E9/F63/F7/F82），历史债按文件冻结在 ruff.toml，
#     新代码必须干净；规则集刻意不开风格类，避免万条噪音导致全员 ignore。

on:
  push:
    branches: [main, master, github-clean]
  pull_request:
  workflow_dispatch:
  # 每晚 03:17（UTC+8）跑一次全量；之前注释里写了 nightly，但 on: 里没有 schedule，
  # 等于全量任务只能手动点 —— 回归只能靠人记得跑。
  schedule:
    - cron: "17 19 * * *"

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: 类型检查（tsc --noEmit）
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

  docs-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 文档自己会过期：源码改了、文档没重生成，这里就红。
      # 校验的是"从代码抽出来的那两份"——端点地图与数据源清单。
      - name: 端点地图未过期
        working-directory: backend
        run: python scripts/gen_api_map.py --check
      - name: 数据源清单未过期
        working-directory: backend
        run: python scripts/gen_data_sources.py --check

  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRIDENT_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: lint（错误级门禁）
        run: ruff check backend/src_python backend/scripts backend/tests

      - name: 依赖一致性审计（requirements ↔ 实装）
        run: python backend/scripts/deps_audit.py
      # 可选依赖单独看一眼实装状态：缺失只打印，不算失败
      - name: 可选依赖状态（不阻塞）
        run: python backend/scripts/deps_audit.py --optional-file backend/requirements-optional.txt -f backend/requirements-optional.txt

      - name: 端点基线（只读，产 artifact）
        run: python backend/scripts/architecture_baseline.py --out backend/reports/baseline

      - name: 版本号命名空间冻结 + 真重复审计
        run: python backend/scripts/legacy_namespace_audit.py

      # 这一步的输出同时落成 backend/reports/qg.txt 并上传成 artifact（qg-output），
      # 失败原因能直接下载读，不靠猜。
      - name: 结构质量闸门（事件循环阻塞 / 兼容垫片 / 别名蜜罐 / 3.11 兼容）
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          mkdir -p backend/reports
          python -c "import sys, locale; print('python', sys.version.split()[0], 'stdout', sys.stdout.encoding, 'fs', locale.getpreferredencoding())" 2>&1 | tee backend/reports/qg.txt
          python backend/scripts/quality_gates.py 2>&1 | tee -a backend/reports/qg.txt

      - name: 上传闸门明细
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qg-output
          path: backend/reports/qg.txt

      - name: 离线核心子集 + 覆盖率（防回退）
        working-directory: backend
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pytest tests/ -q -p no:cacheprovider \
            -k "dimension or reflection or risk or gate or contract or schema or registry or api_format or api_pure or v50" \
            --maxfail=20 \
            --cov=src_python --cov-report=term --cov-report=xml \
            --cov-fail-under=20 2>&1 | tee reports/pytest-subset.txt
        # 门槛说明：2026-11-20 实测该子集对 src_python 的覆盖率 20%。
        # 棘轮规则：门槛 = 实测值，只升不降。每接一个新模块就抬到「新实测」，
        # 目标 60%。直接写 60% 只会让 CI 常红，没人再看。
        # 输出 tee 进 reports/pytest-subset.txt 并上传 artifact：失败原因可直接下载读。

      - name: 上传子集明细
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-subset
          path: backend/reports/pytest-subset.txt

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

      - name: 上传基线
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-baseline
          path: backend/reports/baseline/

  demo-smoke:
    # 目的：证明"陌生人 clone 后能跑"。不是跑测试，是真起一次服务。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIDENT_OFFLINE: "1"
      TRIDENT_DB_PATH: ${{ github.workspace }}/backend/demo.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: 用演示库起服务
        working-directory: backend
        run: |
          python src_python/api_server.py > /tmp/api.log 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            if [ "$code" = "200" ]; then echo "health 200（等待 ${i} 次）"; ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "服务没起来（等了 120s）"
            ps -ef | grep "[a]pi_server.py" || true
            tail -120 /tmp/api.log
            exit 1
          fi
      - name: 64 项目录可读
        run: |
          n=$(curl -sf http://127.0.0.1:8000/api/trident2/features | python -c "import sys,json;print(json.load(sys.stdin)['summary']['total'])")
          echo "features total=$n"
          test "$n" = "64"

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      TRIDENT_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: 全量
        working-directory: backend
        run: python -m pytest tests/ -q -p no:cacheprovider
      - name: 失败时留档
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/.pytest_cache/v/cache/lastfailed
      # 夜间全量红了没人看，等于没跑。这里失败就开 issue，同标题只开一次。
      - name: 失败时开 issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'nightly 全量失败：' + new Date().toISOString().slice(0, 10);
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            if (open.data.some(i => i.title.startsWith('nightly 全量失败'))) {
              core.info('已有未关闭的夜间失败 issue，跳过');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `夜间全量跑红了。日志与 lastfailed 见本次 run：\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

