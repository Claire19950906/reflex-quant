# Bug Report — Reflex Quant
# Use this template for any reproducible bug in the reflection engine,
# showcase, or web pages. For security issues, use Security Advisories instead.

name: 🐛 Bug Report
description: Report a reproducible bug in the reflection engine, showcase, or web pages
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      content: |
        Thanks for taking the time to file a bug report!
        Please fill in the template below so we can reproduce and fix it quickly.

  - type: input
    id: version
    attributes:
      label: Reflex Quant version
      description: Which version did you observe this in? (e.g. v225, commit SHA, or `git rev-parse HEAD`)
      placeholder: "v225 (commit a1b2c3d)"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of the system shows the bug?
      options:
        - Reflection engine (7-layer / 27-layer)
        - Meta-loop self-reflection
        - Knowledge graph persistence
        - Showcase (showcase/index.html)
        - LICENSE-COMMERCIAL.html / pricing calculator
        - Documentation (docs/, README, examples)
        - Build / deploy tooling (deploy.sh, netlify.toml, GitHub Actions)
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug. Include code, data, or a click sequence.
      placeholder: |
        1. Run `./reflex_quant --asset WTI --side SHORT --price 78.50`
        2. Feed in this single news item: "..."
        3. Observe: the engine flags E019 but does not block the trade
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: |
        The trade should have been blocked because evidence grade is L1
        (only one source) and the checker rule says ≥2 sources required.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages or logs.
      placeholder: |
        Trade was placed. PnL was -3.0% intraday.
        Engine log: ...
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, browser, anything relevant.
      placeholder: |
        - OS: macOS 14.5
        - Python: 3.12.2
        - Browser: Safari 17.4
        - Branch: main @ commit a1b2c3d
    validations:
      required: false

  - type: textarea
    id: severity
    attributes:
      label: Severity / impact
      description: How bad is this? Does it block you, lose money, or just look wrong?
      placeholder: |
        Severity: HIGH — wrong error code (E007 vs E012) caused a misclassified trade.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have read [CONTRIBUTING.md](https://github.com/reflex-quant/reflex-quant/blob/main/CONTRIBUTING.md)
          required: true
        - label: This is **not** a security issue (those go to Security Advisories)
          required: true
